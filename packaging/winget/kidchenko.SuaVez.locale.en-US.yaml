ShortDescription: A tray icon that lights up when Claude Code finishes or needs you
Description: |-
  A speech bubble in the notification area that turns green when a Claude Code
  session finishes and amber when it is blocked on a permission prompt or a
  question, with a notification for each.

  The menu lists every open session by project folder. Quick turns and prompts
  you answer right away don't notify. On first launch it adds its hooks to
  Claude Code's settings, and uninstalling removes them.
