ShortDescription: A tray icon that lights up when your coding agent finishes or needs you
Description: |-
  A speech bubble in the notification area that turns green when a coding agent
  session finishes and amber when it is blocked on a permission prompt or a
  question, with a notification for each. Works with Claude Code, Codex,
  Gemini CLI and Devin.

  The menu lists every open session by project folder; click one to bring its
  terminal forward. Quick turns and prompts you answer right away don't notify.
  It adds its hooks to each installed agent's settings, and uninstalling
  removes them.
